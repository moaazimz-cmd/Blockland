 let spawn=new THREE.Vector3(0,2,0),zones=[],movers=[],placed=[],note="",won=false,SP=[[0,5,0],[16,5,16],[-16,5,-16]];const ob=play&&world.id=="classic-obby",race=play&&world.id=="classic-racing",surv=play&&world.id=="natural-disaster-survival",sw=play&&world.id=="classic-sword-fight",sand=play&&world.id=="sandbox-building",cust=play&&!!world.map,own=ob||race||surv||sw||cust,nog=ob||surv,S={ph:"wait",tm:6,alive:true,dis:0,mets:[],wl:-5,wm:null,msg:""},car={v:0,m:null},R={lap:0,nxt:0,t:0,done:false},B=[],Pl={k:0,d:0,hp:100,sw:0},CS=[];
 if(play){if(!nog){const g=new THREE.Mesh(new THREE.BoxGeometry(400,2,400),mat(world.g));g.position.y=-1;g.receiveShadow=true;sc.add(g)}

async function forumThread(id){const p=$("#page");if(!sb||!/^\d+$/.test(id)){location.hash="#forum";return}

function startNet(g){if(!WS_URL||NET)return;let ws;try{ws=new WebSocket(WS_URL)}catch(e){return}
 const P={},say=m=>window.__say&&window.__say("",m);let myId=0,acc=0;NET={ws};
 const list=()=>{const e=$("#pl");if(e)e.innerHTML="<b>Players</b><div>"+PNAME+" (you)</div>"+Object.values(P).map(p=>"<div>"+p.n+"</div>").join("")};
 ws.onopen=()=>{ws.send(JSON.stringify({t:"join",room:g.id,name:PNAME,av}));say("Connected to the online server.")};
 ws.onclose=()=>{say("Disconnected from server.");NET=null;window.NETTICK=null;Object.values(P).forEach(p=>p.c.parent&&p.c.parent.remove(p.c))};
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.t=="hello")myId=m.id;
  else if(m.t=="join"&&m.id!=myId&&eng){const sv={...av};Object.assign(av,m.a||{});const c=buildChar();Object.assign(av,sv);
   const cv=document.createElement("canvas");cv.width=256;cv.height=48;const x=cv.getContext("2d");x.font="bold 30px 'Comic Sans MS',cursive";x.textAlign="center";x.lineWidth=5;x.strokeStyle="#000";x.fillStyle="#fff";x.strokeText(m.n,128,34);x.fillText(m.n,128,34);
   const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));sp.scale.set(8,1.5,1);sp.position.y=6.5;c.add(sp);eng.sc.add(c);P[m.id]={n:m.n,c,x:0,y:5,z:0,r:0,s:"idle"};list();say(m.n+" joined.")}
  else if(m.t=="leave"&&P[m.id]){P[m.id].c.parent&&P[m.id].c.parent.remove(P[m.id].c);say(P[m.id].n+" left.");delete P[m.id];list()}
  else if(m.t=="chat"&&window.__say)window.__say(m.n,m.m);
  else if(m.t=="snap")m.p.forEach(a=>{const p=P[a[0]];if(p){p.x=a[1];p.y=a[2];p.z=a[3];p.r=a[4];p.s=a[5]}})};
 window.NETTICK=(dt,pos,rot,st)=>{acc+=dt;if(acc>.066&&ws.readyState==1){acc=0;ws.send(JSON.stringify({t:"pos",x:pos.x,y:pos.y,z:pos.z,r:rot,s:st}))}
  const k=Math.min(1,dt*10),now=performance.now()/1000;for(const p of Object.values(P)){const c=p.c;c.position.x+=(p.x-c.position.x)*k;c.position.y+=(p.y-c.position.y)*k;c.position.z+=(p.z-c.position.z)*k;let d=p.r-c.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));c.rotation.y+=d*k;animate(c,now,p.s,0)}}}

(function(){if(!(matchMedia("(pointer:coarse)").matches||"ontouchstart" in window))return;document.documentElement.classList.add("touch");
 const key=(c,d)=>dispatchEvent(new KeyboardEvent(d?"keydown":"keyup",{code:c,key:c}));
 function mount(){const v=document.getElementById("view");if(!v||!document.getElementById("hb")||v.querySelector(".tc"))return;
  const h=location.hash,sw=/sword/.test(h),bld=/baseplate|sandbox/.test(h),g=document.createElement("div");g.className="tc";
  let b='<div class="js"><i></i></div><div class="tb" data-k="Space" style="right:14px;bottom:100px">Jump</div><div class="tb" data-t="1" style="right:82px;bottom:92px">Run</div><div class="tb" data-r="1" style="right:14px;bottom:168px">Respawn</div>';
  if(sw)b+='<div class="tb" data-k="KeyF" style="right:82px;bottom:160px">Swing</div>';
  if(bld)b+='<div class="tb" data-k="KeyE" style="right:82px;bottom:160px">Place</div><div class="tb" data-k="KeyQ" style="right:150px;bottom:132px">Remove</div>';
  g.innerHTML=b;v.appendChild(g);
  const js=g.querySelector(".js"),kn=js.firstChild,on={};let jid=null,cx=0,cy=0;
  const set=(c,d)=>{if(!!on[c]!==d){on[c]=d;key(c,d)}};
  const upd=t=>{const dx=t.clientX-cx,dy=t.clientY-cy,m=Math.hypot(dx,dy)||1,k=Math.min(m,40);kn.style.transform="translate("+dx/m*k+"px,"+dy/m*k+"px)";set("KeyW",dy<-14);set("KeyS",dy>14);set("KeyA",dx<-14);set("KeyD",dx>14)};
  js.addEventListener("touchstart",e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;const r=js.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;upd(t)},{passive:false});
  js.addEventListener("touchmove",e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier==jid)upd(t)},{passive:false});
  const end=e=>{for(const t of e.changedTouches)if(t.identifier==jid){jid=null;kn.style.transform="";["KeyW","KeyA","KeyS","KeyD"].forEach(c=>set(c,false))}};js.addEventListener("touchend",end);js.addEventListener("touchcancel",end);
  g.querySelectorAll(".tb").forEach(el=>{el.addEventListener("touchstart",e=>{e.preventDefault();
    if(el.dataset.k)set(el.dataset.k,true);else if(el.dataset.t){set("ShiftLeft",!on.ShiftLeft);el.style.background=on.ShiftLeft?"#c60a":""}else if(el.dataset.r&&eng)eng.respawn()},{passive:false});
   el.addEventListener("touchend",e=>{if(el.dataset.k)set(el.dataset.k,false)});el.addEventListener("touchcancel",()=>{if(el.dataset.k)set(el.dataset.k,false)})});
  let lid=null,lx=0,ly=0;
  v.addEventListener("touchstart",e=>{const t=e.changedTouches[0];if(lid===null&&e.target.tagName=="CANVAS"){lid=t.identifier;lx=t.clientX;ly=t.clientY}},{passive:true});
  v.addEventListener("touchmove",e=>{for(const t of e.changedTouches)if(t.identifier===lid){e.preventDefault();if(eng&&eng.look)eng.look(t.clientX-lx,t.clientY-ly);lx=t.clientX;ly=t.clientY}},{passive:false});
  const le=e=>{for(const t of e.changedTouches)if(t.identifier===lid)lid=null};v.addEventListener("touchend",le);v.addEventListener("touchcancel",le)}
 new MutationObserver(mount).observe(document.getElementById("page"),{childList:true,subtree:true});mount()})();
